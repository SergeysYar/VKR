    value: 100.0
    min: 60.0
    max: 180.0
    distribution: uniform
  factory_depth:
    value: 80.0
    min: 50.0
    max: 150.0
    distribution: uniform
  number_of_rooms:
    value: 8
    min: 8
    max: 10
    distribution: uniform
  corridor_width:
    value: 4.0
    min: 2.0
    max: 8.0
    distribution: uniform
  room_size_min:
    value: 5.0
    min: 3.0
    max: 10.0
    distribution: uniform
  room_size_max:
    value: 20.0
    min: 8.0
    max: 30.0
    distribution: uniform
  room_height:
    value: room_size_max * 0.3
    min: 4.0
    max: 10.0
    distribution: normal
  wall_thickness:
    value: corridor_width * 0.05
    min: 0.12
    max: 0.45
    distribution: uniform
  column_spacing:
    value: 6.0
    min: 4.0
    max: 10.0
    distribution: uniform
  column_radius:
    value: 0.3
    min: 0.2
    max: 0.6
    distribution: normal
metadata:
  version: 1.0.0
