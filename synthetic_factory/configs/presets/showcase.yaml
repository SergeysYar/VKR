  - office
  - boiler
  - storage
  - electrical
  - maintenance
  - laboratory
  - control
  profiles:
    workshop:
      height_multiplier: 1.25
      door_count: 2
      window_count: 2
    office:
      height_multiplier: 0.85
      door_count: 1
      window_count: 4
    boiler:
      height_multiplier: 1.5
      door_count: 1
      window_count: 1
