  octaves: 4
  frequency: 1.0
  persistence: 0.5
  lacunarity: 2.0
  sampling_scale: 0.08
  full_occupancy: true
  slot_multiplier: 2.0
  threshold: 0.35
  connectivity_bias: 0.8
  min_distance: 10.0
  aspect_strength: 0.35
